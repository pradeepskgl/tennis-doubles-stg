<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AO Tennis Doubles Tournament: Aug 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <div class="header-top">
    <h1>🏆 AO Tennis Doubles Tournament: Aug 2026</h1>
    <div id="authArea"></div>
  </div>
  <nav id="navArea"></nav>
</header>
<main>
  <div id="stageTabs" style="margin-bottom: 14px;">
    <button onclick="renderStage('Group')" id="tabGroup">Group Stage</button>
    <button class="secondary" onclick="renderStage('Knockout')" id="tabKnockout">Semifinals &amp; Final</button>
  </div>
  <div id="matchList"></div>
</main>

<script src="/js/api.js"></script>
<script src="/js/shared.js"></script>
<script>
let matches = [];
let currentStage = 'Group';

function playerPills(teamName) {
  const parts = (teamName || '').split(' & ');
  if (parts.length !== 2) return teamName || '';
  return `<span class="pill">${parts[0]}</span> &amp; <span class="pill">${parts[1]}</span>`;
}

function formatSetsSummary(score) {
  if (!score || !score.sets || score.sets.length === 0) return '';
  const parts = score.sets.map(set => {
    let label = `${set.p1Games}-${set.p2Games}`;
    if (set.tiebreak && set.wonBy) label += `(${set.tiebreak.p1}-${set.tiebreak.p2})`;
    return label;
  });
  if (score.matchTiebreak) parts.push(`MTB ${score.matchTiebreak.p1}-${score.matchTiebreak.p2}`);
  return parts.join(', ');
}

function formatDuration(startIso, endIso) {
  if (!startIso || !endIso) return '';
  const ms = new Date(endIso).getTime() - new Date(startIso).getTime();
  if (ms < 0) return '';
  const totalMinutes = Math.round(ms / 60000);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

async function loadMatches() {
  matches = await Api.get('/api/matches');
  renderStage(currentStage);
}

function renderStage(stage) {
  currentStage = stage;
  document.getElementById('tabGroup').className = stage === 'Group' ? '' : 'secondary';
  document.getElementById('tabKnockout').className = stage === 'Knockout' ? '' : 'secondary';

  const filtered = stage === 'Group'
    ? matches.filter(m => m.stage === 'Group')
    : matches.filter(m => m.stage === 'Semifinal' || m.stage === 'Final');

  const list = document.getElementById('matchList');
  list.innerHTML = filtered.map(m => {
    const winnerName = m.status === 'completed' && m.score && m.score.winner ? m[m.score.winner].name : null;
    const groupLabel = m.group ? `Group ${m.group} - ` : '';
    const setsSummary = (m.status === 'completed' && m.score) ? formatSetsSummary(m.score) : '';
    const duration = m.status === 'completed' ? formatDuration(m.actualStart, m.actualEnd) : '';
    return `
    <div class="match-card" onclick="location.href='/match.html?m=${m.matchNumber}'">
      <div>
        <div class="match-meta">Match ${m.matchNumber} - ${groupLabel}${m.stage} - ${m.session || ''} - ${m.scheduledStart} to ${m.scheduledEnd}</div>
        <div class="match-players">${playerPills(m.team1.name)} <span class="small-note">vs</span> ${playerPills(m.team2.name)}</div>
        ${setsSummary ? `<div class="match-meta" style="margin-top:4px; font-weight:700; font-size:14px; color:#e9f0ea;">${setsSummary}</div>` : ''}
        ${duration ? `<div class="match-meta">Match time: ${duration}</div>` : ''}
        ${winnerName ? `<div class="match-meta" style="color:#ffd479;">Winner: ${winnerName} 🏆</div>` : ''}
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <span class="badge ${m.status}">${m.status.replace('_',' ')}</span>
      </div>
    </div>
  `;
  }).join('') || '<p class="small-note">No matches found.</p>';
}

(async function init() {
  await initShared('matches');
  await loadMatches();
})();
</script>
</body>
</html>
